<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-labelledby="title desc">
  <title id="title">Rust ownership and borrowing flow</title>
  <desc id="desc">A String is owned by main, temporarily borrowed by a function, and then available to main again.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="280" rx="20" fill="#f8fafc"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <rect x="40" y="72" width="240" height="130" rx="14" fill="#f97316"/>
    <text x="160" y="118" font-size="24" font-weight="700" fill="#ffffff">main owns String</text>
    <text x="160" y="155" font-size="19" fill="#fff7ed">let title = String::from(...)</text>
    <text x="160" y="181" font-size="18" fill="#fff7ed">Owner remains main</text>

    <rect x="360" y="72" width="240" height="130" rx="14" fill="#2563eb"/>
    <text x="480" y="118" font-size="24" font-weight="700" fill="#ffffff">function borrows</text>
    <text x="480" y="155" font-size="20" fill="#eff6ff">title_length(&amp;title)</text>
    <text x="480" y="181" font-size="18" fill="#eff6ff">Read-only reference</text>

    <rect x="680" y="72" width="240" height="130" rx="14" fill="#16a34a"/>
    <text x="800" y="118" font-size="24" font-weight="700" fill="#ffffff">main uses String</text>
    <text x="800" y="155" font-size="20" fill="#f0fdf4">println!("{title}")</text>
    <text x="800" y="181" font-size="18" fill="#f0fdf4">Still valid after borrow</text>

    <line x1="280" y1="137" x2="348" y2="137" stroke="#334155" stroke-width="5" marker-end="url(#arrow)"/>
    <line x1="600" y1="137" x2="668" y2="137" stroke="#334155" stroke-width="5" marker-end="url(#arrow)"/>
    <text x="320" y="124" font-size="16" fill="#334155">lend</text>
    <text x="640" y="124" font-size="16" fill="#334155">return</text>
  </g>
</svg>
